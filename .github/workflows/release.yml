name: release

# Publishes to nuget.org with Trusted Publishing (no stored API key).
# Trigger: push a tag like v1.0.0. The tag must match <Version> in the csproj.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    # Must match the Environment on the nuget.org Trusted Publishing policy.
    environment: production
    permissions:
      contents: read
      id-token: write   # lets NuGet/login exchange GitHub's OIDC token for a short-lived API key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check tag matches package version
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          [xml]$proj = Get-Content src/Ark.SessionState.AdoNet/Ark.SessionState.AdoNet.csproj
          $projVersion = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($tagVersion -ne $projVersion) {
            Write-Error "Tag version '$tagVersion' does not match csproj <Version> '$projVersion'."
            exit 1
          }

      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/Ark.SessionState.AdoNet -c Release --no-build -o artifacts

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: pwsh
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
